<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube to MP4</title>
  <meta name="description" content="Paste a YouTube link and save it as an MP4." />
  <meta name="theme-color" content="#1a1024" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wash" aria-hidden="true"></div>
  <main class="shell">
    <header class="top">
      <div>
        <p class="eyebrow">YouTube → MP4</p>
        <h1>YouTube Downloader</h1>
      </div>
      <button type="button" class="ghost" id="open-folder">Open folder</button>
    </header>

    <form class="card" id="form" autocomplete="off">
      <label class="field">
        <span>YouTube link</span>
        <input id="url" name="url" type="url" inputmode="url" spellcheck="false"
          placeholder="https://www.youtube.com/watch?v=…" required />
      </label>
      <div class="split">
        <label class="field">
          <span>Quality</span>
          <select id="quality" name="quality">
            <option value="best" selected>Best available</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
        </label>
        <label class="field">
          <span>Save as <em>(optional)</em></span>
          <input id="filename" name="filename" type="text" spellcheck="false"
            placeholder="Uses the video title" maxlength="160" />
        </label>
      </div>
      <p class="hint">Paste a YouTube, Shorts, or youtu.be link. Saved as <code>.mp4</code>.</p>
      <div class="actions">
        <button type="submit" class="primary" id="download-btn">Download MP4</button>
        <p class="folder" id="folder-label">Saves to Downloads\MP4 Downloader</p>
      </div>
      <p class="banner" id="banner" hidden></p>
    </form>

    <section class="card list-card">
      <div class="list-head">
        <h2>Downloads</h2>
        <span id="count-pill">None yet</span>
      </div>
      <ul id="jobs" class="jobs">
        <li class="empty">Paste a YouTube link and hit download.</li>
      </ul>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
